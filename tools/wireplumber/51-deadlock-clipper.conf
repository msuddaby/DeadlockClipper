# Deadlock Clipper: never remember which output Deadlock's audio was moved to.
# The clipper temporarily routes the game's sound to a silent sink while rendering; without this rule
# WirePlumber would save that choice and normal play sessions would also be silent.
# Install: copy to ~/.config/wireplumber/wireplumber.conf.d/ and run: systemctl --user restart wireplumber
stream.rules = [
  {
    matches = [
      { application.name = "deadlock.exe" }
    ]
    actions = {
      update-props = {
        state.restore-target = false
      }
    }
  }
]
